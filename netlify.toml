[build]
  publish = "src"
  # Static site — no build step.

# ---------------------------------------------------------------------------
# Clean URLs for the pages the live App Store listing links to.
# These paths MUST keep resolving — App Review reads /privacy-policy and
# /support. Explicit rewrites rather than relying on Netlify's Pretty URLs.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/terms-of-use"
  to = "/terms-of-use.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms-of-use.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# site.css and site.js are not fingerprinted, so a long max-age means a
# returning visitor gets today's HTML with yesterday's stylesheet — which
# is a broken page, not a stale one. Revalidate instead; both files are
# small and Netlify answers with a 304 off the ETag.
[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
