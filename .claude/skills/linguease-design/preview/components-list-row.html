<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Word rows</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css"></head><body class="card">
<div style="background:var(--bg-page);border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--c-darker-outline);">
  <div style="display:flex;align-items:center;border-bottom:1px solid rgba(0,0,0,0.05);padding:0;">
    <div style="width:2px;height:65px;background:var(--c-off-black);margin-left:16px;border-radius:20px;"></div>
    <div style="flex:1;padding:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-family:var(--ff-serif);font-size:24px;color:var(--c-off-black);">ciao</div>
        <div style="width:32px;height:32px;border-radius:50%;background:var(--c-light-grey);display:flex;align-items:center;justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M11 5L6 9H2v6h4l5 4V5z M15.54 8.46a5 5 0 010 7.07 M19.07 4.93a10 10 0 010 14.14" stroke="#434446" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;">
        <div style="font-family:var(--ff-serif);font-style:italic;font-size:20px;color:var(--c-mid-grey);">hello</div>
        <div style="font-family:var(--ff-sans);font-size:16px;font-weight:300;color:rgba(67,68,70,0.4);">/ˈtʃaːo/</div>
      </div>
    </div>
  </div>
  <div style="display:flex;align-items:center;border-bottom:1px solid rgba(0,0,0,0.05);padding:0;">
    <div style="flex:1;padding:16px;">
      <div style="font-family:var(--ff-serif);font-size:24px;color:var(--c-off-black);">arigato</div>
      <div style="font-family:var(--ff-serif);font-style:italic;font-size:20px;color:var(--c-mid-grey);margin-top:8px;">thank you</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;padding:0;">
    <div style="flex:1;padding:16px;">
      <div style="font-family:var(--ff-serif);font-size:24px;color:var(--c-mid-grey);">Translation</div>
      <div style="font-family:var(--ff-serif);font-style:italic;font-size:20px;color:rgba(196,190,187,0.6);margin-top:8px;">Add a word in English</div>
    </div>
  </div>
</div>
