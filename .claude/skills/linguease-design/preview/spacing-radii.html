<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Corner radii</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css"></head><body class="card">
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;">
  
    <div>
      <div style="aspect-ratio:1/1;background:var(--c-light-grey);border-radius:10px;"></div>
      <div style="margin-top:6px;font-family:var(--ff-sans);font-size:11px;color:var(--c-off-black);">10px</div>
      <div class="mono">Primary button</div>
    </div>
    <div>
      <div style="aspect-ratio:1/1;background:var(--c-light-grey);border-radius:12px;"></div>
      <div style="margin-top:6px;font-family:var(--ff-sans);font-size:11px;color:var(--c-off-black);">12px</div>
      <div class="mono">Card · group</div>
    </div>
    <div>
      <div style="aspect-ratio:1/1;background:var(--c-light-grey);border-radius:16px;"></div>
      <div style="margin-top:6px;font-family:var(--ff-sans);font-size:11px;color:var(--c-off-black);">16px</div>
      <div class="mono">Chip · segmented</div>
    </div>
    <div>
      <div style="aspect-ratio:1/1;background:var(--c-light-grey);border-radius:18px;"></div>
      <div style="margin-top:6px;font-family:var(--ff-sans);font-size:11px;color:var(--c-off-black);">18px</div>
      <div class="mono">Video modal</div>
    </div>
    <div>
      <div style="aspect-ratio:1/1;background:var(--c-light-grey);border-radius:38px;"></div>
      <div style="margin-top:6px;font-family:var(--ff-sans);font-size:11px;color:var(--c-off-black);">38px</div>
      <div class="mono">Sheet</div>
    </div>
    <div>
      <div style="aspect-ratio:1/1;background:var(--c-light-grey);border-radius:999px;"></div>
      <div style="margin-top:6px;font-family:var(--ff-sans);font-size:11px;color:var(--c-off-black);">999 pill</div>
      <div class="mono">Capsule</div>
    </div>
</div>
