<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Buttons</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css"></head><body class="card">
<div class="stack" style="gap:14px;">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div style="background:var(--c-off-black);border-radius:10px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--c-white);font-family:var(--ff-sans);font-weight:500;font-size:16px;">Continue</div>
    <div style="background:var(--c-mid-off-black);border-radius:10px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--c-white);font-family:var(--ff-sans);font-weight:500;font-size:16px;">Continue (pressed)</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div style="background:var(--c-white);border-radius:10px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--c-off-black);font-family:var(--ff-sans);font-weight:500;font-size:16px;box-shadow:inset 0 0 0 1px var(--c-darker-outline);">Continue</div>
    <div style="background:var(--c-yellow);border-radius:10px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--c-off-black);font-family:var(--ff-sans);font-weight:500;font-size:16px;">Continue</div>
  </div>
  <div style="display:flex;gap:12px;align-items:center;margin-top:4px;">
    <div style="width:60px;height:60px;border-radius:50%;background:var(--c-terracotta);display:flex;align-items:center;justify-content:center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <div class="mono">FAB · terracotta · 60×60 · icon_plus 28×28</div>
  </div>
  <div class="mono" style="margin-top:4px;">52px tall · radius 10 · Roboto 16 medium · dark ink (#434446) on white & yellow, white on off-black</div>
</div>
</body></html>
