<!doctype html><html lang="en"><head><meta charset="utf-8"><title>The one shadow</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css"></head><body class="card">
<div style="display:flex;gap:20px;align-items:stretch;">
  <div style="flex:1;background:var(--bg-page);padding:20px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--c-darker-outline);">
    <div class="lbl" style="margin-bottom:8px;">Banner card — the only shadow</div>
    <div style="background:var(--c-white);border-radius:12px;padding:16px;box-shadow:0 12px 24px rgba(0,0,0,0.05);">
      <div style="font-family:var(--ff-sans);font-weight:500;font-size:16px;color:var(--c-off-black);">Finish setting up</div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:12px;">
        <div style="width:18px;height:18px;border-radius:50%;border:2px solid var(--c-light-grey);"></div>
        <div style="font-family:var(--ff-sans);font-size:14px;font-weight:300;color:var(--c-dark-grey);">Swipe a word right to complete it</div>
      </div>
    </div>
  </div>
  <div style="width:260px;display:flex;flex-direction:column;justify-content:center;">
    <div class="mono" style="font-size:12px;color:var(--c-off-black);">box-shadow:</div>
    <div class="mono" style="font-size:12px;color:var(--c-off-black);">0 12px 24px</div>
    <div class="mono" style="font-size:12px;color:var(--c-off-black);">rgba(0,0,0,0.05);</div>
    <div class="mono" style="margin-top:8px;color:var(--c-mid-grey);">Used on the "Finish setting up" banner. Everything else in the system is flat.</div>
  </div>
</div>
